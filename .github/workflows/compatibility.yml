name: Compatibility

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "agent_routing_eval_lab/**"
      - "tests/**"
      - ".github/workflows/compatibility.yml"
  schedule:
    - cron: "55 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-floor:
    name: Config extra at declared floor
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install minimum direct versions
        run: uv pip install --system --resolution lowest-direct -e ".[config]" pytest
      - name: Test
        run: pytest -q

  python-next:
    name: Python 3.15 pre-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
