[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-routing-eval-lab"
version = "0.1.0"
description = "Offline evaluation lab for agent routing and tool-selection policies before production."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "agent-routing-eval-lab contributors"}]
license = {file = "LICENSE"}
keywords = [
    "agent-evaluation",
    "offline-evaluation",
    "off-policy-evaluation",
    "counterfactual-evaluation",
    "llm-agents",
    "tool-calling",
    "routing",
    "ai-governance",
    "mlops",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
# Optional YAML config surface (agent_routing_eval_lab.config). The deterministic
# core stays dependency-free; install this to load catalog/policies from YAML.
config = [
  "pyyaml>=6.0",
]
# Historical source-install compatibility only; real maintainer tooling is the
# local PEP 735 group below and is not published as wheel metadata.
dev = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
  "ruff>=0.6",
  "mypy>=1.8",
]

[project.scripts]
agent-routing-eval-lab = "agent_routing_eval_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors/warnings (E/W), isort (I), pyupgrade (UP),
# flake8-bugbear (B). A pragmatic, widely-used baseline for a typed library.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
# PyYAML (behind the optional 'config' extra) is the only third-party import in an
# otherwise zero-dependency core, and we do not type-check into it. Suppress the
# untyped-import diagnostic so the check is clean with or without the yaml stubs
# installed.
disable_error_code = ["import-untyped"]